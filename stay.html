<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stay — Città Continua</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="topbar">
    <a class="back-pill" href="index.html">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 17L7 7"/><path d="M7 13V7h6"/></svg>
      </span>
      Stay
    </a>
    <p class="page-subtitle">Live between Apice Nuova and Apice Vecchia through slow, everyday and temporary forms of residence.</p>
  </div>

  <main>
    <div class="stay-grid">

      <article class="card stay-card">
        <div class="card__body">
          <p class="stay-card__title">Spend a semester in<strong>Student Residence</strong></p>
        </div>
        <div class="stay-card__img">
          <img src="assets/img/stay-student.jpg" alt="Interno luminoso di una residenza per studenti con spazi comuni">
        </div>
      </article>

      <article class="card stay-card">
        <div class="card__body">
          <p class="stay-card__title">Become a resident of<strong>Digital rural hub</strong></p>
        </div>
        <div class="stay-card__img">
          <img src="assets/img/stay-digital.jpg" alt="Spazio di coworking rurale con illuminazione moderna">
        </div>
      </article>

      <article class="card stay-card">
        <div class="card__body">
          <p class="stay-card__title">Become a part of the community of<strong>Assisted Living Cluster</strong></p>
        </div>
        <div class="stay-card__img">
          <img src="assets/img/stay-assisted.jpg" alt="Cucina condivisa di un cluster di residenza assistita">
        </div>
      </article>

    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>

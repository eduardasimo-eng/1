<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make — Città Continua</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="topbar">
    <a class="back-pill" href="index.html">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 17L7 7"/><path d="M7 13V7h6"/></svg>
      </span>
      Make
    </a>
    <p class="page-subtitle">Create, produce and activate new forms of local value.</p>
  </div>

  <main>
    <div class="make-grid">

      <div class="make-col">
        <article class="card make-card">
          <div class="card__body">
            <p class="card__title">Take part in<strong>Local Harvest Fair</strong></p>
            <p class="card__text">Local farmers, residents and visitors meet around seasonal products, food, small markets and public events, turning the landscape around Apice into an active part of local life.</p>
          </div>
          <div class="make-card__img">
            <img src="assets/img/make-harvest.jpg" alt="Mercato locale con prodotti stagionali ad Apice">
          </div>
        </article>

        <article class="card make-card make-card--muted">
          <div class="card__body">
            <p class="card__title">Host a<strong>Cultural Event</strong></p>
          </div>
          <div class="make-card__img">
            <img src="assets/img/make-cultural.jpg" alt="Evento culturale serale in un vicolo di Apice">
          </div>
        </article>
      </div>

      <div class="make-or">Or</div>

      <div class="make-col">
        <form class="card make-form" data-fake-submit>
          <textarea name="initiative" placeholder="Write your initiative to us…" required></textarea>
          <div class="form-note" aria-live="polite"></div>
          <div class="make-form__footer">
            <button class="btn" type="submit">Send</button>
          </div>
        </form>
      </div>

    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>

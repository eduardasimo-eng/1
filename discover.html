<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover — Città Continua</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="topbar">
    <a class="back-pill" href="index.html">
      <span class="icon dot"></span>
      Discover
    </a>
  </div>

  <main>
    <div class="discover-track">

      <article class="discover-card">
        <div class="discover-card__text">
          <p>Explore the<strong>Landscape Trail</strong></p>
        </div>
        <div class="discover-card__img">
          <img src="assets/img/discover-ruin.jpg" alt="">
        </div>
      </article>

      <article class="discover-card is-active">
        <div class="discover-card__text">
          <p>Dive into the history in<strong>Open-Air Ruin Museum</strong></p>
        </div>
        <div class="discover-card__img">
          <img src="assets/img/discover-ruin.jpg" alt="Rovina storica di Apice Vecchia trasformata in museo a cielo aperto">
        </div>
      </article>

      <article class="discover-card">
        <div class="discover-card__text">
          <p>Stay for a weekend in<strong>Albergo Diffuso</strong></p>
        </div>
        <div class="discover-card__img">
          <img src="assets/img/discover-ruin.jpg" alt="">
        </div>
      </article>

    </div>
    <div class="discover-dots"></div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>

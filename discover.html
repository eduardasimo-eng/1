<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover — Città Continua</title>
<link rel="stylesheet" href="assets/css/style.css?v=14">
</head>
<body>

  <div class="topbar">
    <a class="back-pill" href="index.html">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 17L7 7"/><path d="M7 13V7h6"/></svg>
      </span>
      Discover
    </a>
    <p class="page-subtitle">Explore a reconnected landscape of heritage, paths and everyday encounters.</p>
  </div>

  <main>
    <div class="discover-main">
      <div class="accordion">

        <article class="accordion-item is-open">
          <button class="accordion-item__toggle" type="button" aria-expanded="true">
            <div class="accordion-item__text">
              <p class="accordion-item__title">Dive into the history in<strong>Open-Air Ruin Museum</strong></p>
              <div class="accordion-item__desc">
                <p>Walk through the open-air ruin museum and discover the traces of former houses, streets and public spaces of Apice Vecchia.</p>
                <p>The route reveals the memory of the old town while allowing visitors to experience it as part of a renewed cultural landscape.</p>
              </div>
            </div>
            <div class="accordion-item__img">
              <img src="assets/img/discover-ruin.jpg" alt="Rovina storica di Apice Vecchia trasformata in museo a cielo aperto">
            </div>
          </button>
        </article>

        <article class="accordion-item">
          <button class="accordion-item__toggle" type="button" aria-expanded="false">
            <div class="accordion-item__text">
              <p class="accordion-item__title">Stay for a weekend in<strong>Albergo Diffuso</strong></p>
              <div class="accordion-item__desc">
                <p>Spend a weekend inside the restored fabric of Apice Vecchia, where former houses become small places to stay.</p>
                <p>The experience allows visitors to live close to the open-air museum, local food spaces and panoramic routes, turning heritage into a slow everyday encounter.</p>
              </div>
            </div>
            <div class="accordion-item__img">
              <img src="assets/img/discover-albergo.jpg" alt="Cortile in pietra dell'Albergo Diffuso di Apice Vecchia">
            </div>
          </button>
        </article>

        <article class="accordion-item">
          <button class="accordion-item__toggle" type="button" aria-expanded="false">
            <div class="accordion-item__text">
              <p class="accordion-item__title">Explore the<strong>Landscape Trail</strong></p>
              <div class="accordion-item__desc">
                <p>Follow the landscape trail connecting Apice Nuova, Apice Vecchia, agricultural fields and natural viewpoints.</p>
                <p>The route reveals the rural character of the territory and turns the space between the two towns into an active part of the visit.</p>
              </div>
            </div>
            <div class="accordion-item__img">
              <img src="assets/img/discover-landscape.jpg" alt="Sentiero panoramico tra Apice Nuova e Apice Vecchia">
            </div>
          </button>
        </article>

      </div>
    </div>
  </main>

  <script src="assets/js/main.js?v=14"></script>
</body>
</html>
